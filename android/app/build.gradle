plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.hanif.mymanager"
    compileSdk 36
    ndkVersion "26.1.10909125"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    // JVM target for Kotlin compilation is set centrally in the root
    // android/build.gradle (applies to every module, including this one) —
    // removed the duplicate here since it used the older `kotlinOptions`
    // DSL, which caused a build-breaking incompatibility once other
    // plugins pulled in a different Kotlin Gradle Plugin resolution.

    defaultConfig {
        applicationId "com.hanif.mymanager"
        minSdk 29
        targetSdk 36
        versionCode 25
        versionName "5.3.3"
        multiDexEnabled true
    }

    // ক্র্যাশের মূল কারণ (ClassCastException: TinylogLoggingProvider cannot be
    // cast to DynamicLevelLoggingProvider): flutter_autofill_service নিজের
    // DynamicLevelLoggingProvider রেজিস্টার করে, আর tinylog-impl রেজিস্টার করে
    // সাধারণ TinylogLoggingProvider। দুটোই একই
    // META-INF/services/org.tinylog.provider.LoggingProvider ফাইলে merge হয়ে
    // যায়, আর tinylog ভুল প্রোভাইডারটা বেছে নিলে AutofillService তৈরি হওয়ার
    // মুহূর্তেই অ্যাপ ক্র্যাশ করে। এখানে app-এর নিজের ফাইলটাকেই একমাত্র
    // সত্য ধরা হচ্ছে (src/main/resources/META-INF/services/... দেখো)।
    packaging {
        resources {
            pickFirsts += ['META-INF/services/org.tinylog.provider.LoggingProvider']
        }
    }

    signingConfigs {
        release {
            keyAlias System.getenv("ALIAS") ?: "hanif-key"
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
            storeFile file("my-manager.jks")
            storePassword System.getenv("STORE_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    // Required for the LaunchTheme/NormalTheme Theme.AppCompat parent above
    // (local_auth's biometric/PIN prompt needs an AppCompat theme).
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // ScreenTimeWorker (স্ক্রিন টাইম সতর্কবার্তা) — প্রজেক্টের জোর-করা ভার্সনের সাথে মেলানো
    implementation 'androidx.work:work-runtime-ktx:2.8.1'
}

// workmanager and home_widget each pull in a different version of
// androidx.work (2.8.1 vs 2.7.1 via its -ktx artifact), causing a
// duplicate-class error at release build time. Forcing both to the same
// version makes Gradle resolve them as one, instead of two conflicting
// copies.
//
// Separately, one of the newer plugins (likely flutter_secure_storage or
// flutter_autofill_service) transitively pulls in androidx.core 1.17.0,
// which refuses to build under anything older than Android Gradle Plugin
// 8.9.1 (we're on 8.6.0). Rather than chase an AGP/Gradle/Kotlin version
// upgrade chain, force androidx.core back to a well-established version
// from before that AGP-version gate existed.
configurations.all {
    resolutionStrategy {
        force 'androidx.work:work-runtime:2.8.1'
        force 'androidx.work:work-runtime-ktx:2.8.1'
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
    }
}
